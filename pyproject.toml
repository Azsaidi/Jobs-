[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot"
version = "0.1.0"
description = "Finds UAE job openings that fit your profile, tailors an ATS-friendly CV for each one, applies, notifies you and tracks every application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "python-docx>=1.1",
    "PyYAML>=6.0",
    "reportlab>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
import = ["pdfplumber>=0.11"]
dev = ["pytest>=8"]

[project.scripts]
jobbot = "jobbot.cli:main"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
jobbot = ["templates/*"]
