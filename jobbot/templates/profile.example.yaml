# Answers for application-form screening questions. `match` is a regex tested against the
# question text (case-insensitive); the first match wins. Questions with no answer here stop
# auto-submission, and the form is left for you.
application_answers:
  - match: "notice period"
    answer: "1 month"
  - match: "current (salary|compensation|package)"
    answer: "Prefer to discuss"
  - match: "salary|compensation|expected (pay|package|ctc)"
    answer: "25000"                  # monthly AED; use "Negotiable" if you prefer
  - match: "sponsor"                # before "visa": "Do you need visa sponsorship?"
    answer: "No"
  - match: "authori[sz]ed to work|right to work|eligib\\w* to work|work permit|legally"
    answer: "Yes"
  - match: "visa"
    answer: "UAE residence visa (transferable)"
  - match: "relocat"
    answer: "Yes"
  - match: "years of (relevant |professional )?experience"
    answer: "7"
  - match: "currently (based|located|residing) in (the )?uae|live in (the )?uae|uae resident"
    answer: "Yes"
  - match: "arabic"
    answer: "Basic"
  - match: "driving licen[cs]e"
    answer: "Yes"
  - match: "how did you hear|where did you (hear|find)"
    answer: "Company careers page"
  - match: "start date|when can you start|available to start"
    answer: "1 month from offer"
  - match: "employment status"
    answer: "Employed"
  - match: "level of education|highest (degree|qualification)"
    answer: "Bachelor's Degree"
  # Attestations ("I confirm the information provided is true") - only keep this if your profile is accurate.
  - match: "confirm that the information|true and (complete|accurate|correct)"
    answer: "Yes"
